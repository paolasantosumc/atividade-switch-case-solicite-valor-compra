<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>PS | Forma de Pagamento</title>
</head>
<body>
    <div class="container">
        <h1>Pagamento da Compra</h1>
        <label for="valor">Valor total da compra:</label>
        <input type="number" id="valor" step="0.01" placeholder="Digite o valor">
        <br><br>

        <label for="pagamento">Forma de pagamento:</label>
        <select id="pagamento">
            <option value="1">Dinheiro/PIX - 10% de desconto</option>
            <option value="2">Débito - 5% de desconto</option>
            <option value="3">Crédito - Sem desconto</option>
        </select>

        <br><br>
        <button onclick="calcular()">Calcular</button>
        <h2 id="resultado"></h2>
    </div>
    <footer>Desenvolvido por Paola Santos</footer>
    <script>
        function calcular() {

            let valorTotal = Number(document.getElementById("valor").value);
            let pagamento = Number(document.getElementById("pagamento").value);
            let valorFinal;

            switch (pagamento) {

                case 1:
                    valorFinal = valorTotal * 0.90;
                    break;

                case 2:
                    valorFinal = valorTotal * 0.95;
                    break;

                case 3:
                    valorFinal = valorTotal;
                    break;

                default:
                    document.getElementById("resultado").innerHTML =
                        "Forma de pagamento inválida.";
                    return;
            }

            document.getElementById("resultado").innerHTML =
                "Valor final a pagar: R$ " + valorFinal.toFixed(2);
        }
    </script>

</body>
</html>
